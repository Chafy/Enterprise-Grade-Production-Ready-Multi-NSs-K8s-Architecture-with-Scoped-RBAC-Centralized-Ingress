
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-app
  namespace: mongo-ns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      affinity:
       nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: 
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: In
                values:
                - mongo
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "mongo"
        effect: "NoSchedule"
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
          - containerPort: 27017
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: mongo-pass
                key: username
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongo-pass
                key: password
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db  
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: mongo-pvc