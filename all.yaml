

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-app
  namespace: mongo-ns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      affinity:
       nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: 
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: In
                values:
                - mongo
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "mongo"
        effect: "NoSchedule"
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
          - containerPort: 27017
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: mongo-pass
                key: username
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongo-pass
                key: password
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db  
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: mongo-pvc
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: mongo-ns
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: mongo-sc
  resources:
    requests:
      storage: 5Gi
---


apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mongo-sc
  namespace: mongo-ns
provisioner: ebs.csi.aws.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer






---

apiVersion: v1
kind: Secret
metadata:
    name: mongo-pass
    namespace: mongo-ns
type: Opaque
data:
    username: bW9uZ28tdXNlcg==
    password: bW9uZ28tcGFzc3dvcmQ=
---

apiVersion: v1
kind: Service
metadata:
  name: mongo-svc
  namespace: mongo-ns
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: mongoex-cm
  namespace: mongo-ns
data:
  database_url: mongo-svc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongoex-app
  namespace: mongo-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongoex-app
  template:
    metadata:
      labels:
        app: mongoex-app
    spec:
      affinity:
       nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: 
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: In
                values:
                - mongo
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "mongo"
        effect: "NoSchedule"
      containers:
      - name: mongo-express
        image: mongo-express:1.0.2
        ports:
          - containerPort: 8081
        env:
          - name: ME_CONFIG_MONGODB_ADMINUSERNAME
            valueFrom:
              secretKeyRef:
                name: mongo-pass
                key: username
          - name: ME_CONFIG_MONGODB_ADMINPASSWORD
            valueFrom:
              secretKeyRef:
                name: mongo-pass
                key: password
          - name: ME_CONFIG_BASICAUTH
            value: "false"             
          - name: ME_CONFIG_MONGODB_SERVER
            valueFrom:
              configMapKeyRef:
                name: mongoex-cm
                key: database_url
          - name: ME_CONFIG_SITE_BASEURL
            value: "/mongo/"



---

apiVersion: v1
kind: Service
metadata:
  name: mongoex-svc
  namespace: mongo-ns
spec:
  type: ClusterIP
  selector:
    app: mongoex-app   
  ports:
    - port: 8081      
      targetPort: 8081 
     

