apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: wordpress-ns
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: mysql-sc
  resources:
    requests:
      storage: 5Gi


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-app
  namespace: wordpress-ns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress
      tier: mysql
  template:
    metadata:
      labels:
        app: wordpress
        tier: mysql
    spec:
      affinity:
       nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: 
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: In
                values:
                - wordpress
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "wordpress"
        effect: "NoSchedule"
      containers:
      - image: mysql:8.0
        name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-pass
              key: password
        - name: MYSQL_DATABASE
          value: "wordpress"
        - name: MYSQL_USER
          value: "wp-user"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-pass
              key: password     
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc

---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mysql-sc
  namespace: wordpress-ns
provisioner: ebs.csi.aws.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---


apiVersion: v1
kind: Secret
metadata:
  name: mysql-pass
  namespace: wordpress-ns
type: Opaque
data:
  password: bXlzcWwtcGFzc3dvcmQ=

---

apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: wordpress-ns
  labels:
    app: wordpress
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: wordpress
    tier: mysql

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-cm
  namespace: wordpress-ns
data:
  database_url: mysql-svc

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
      tier: frontend
  template:
    metadata:
      labels:
        app: wordpress
        tier: frontend
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: In
                values:
                - wordpress
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "wordpress"
        effect: "NoSchedule"
      containers:
      - name: wordpress
        image: wordpress:6.6-apache
        ports:
        - containerPort: 80
          name: wordpress
        env:
        - name: WORDPRESS_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: wordpress-cm
              key: database_url
        - name: WORDPRESS_DB_NAME
          value: "wordpress"
        - name: WORDPRESS_DB_USER
          value: "wp-user"
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-pass
              key: password
        # - name: MYSQL_ROOT_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: mysql-pass
        #       key: password
        - name: WORDPRESS_CONFIG_EXTRA
          value: |
            define('WP_HOME', 'http://' . $_SERVER['HTTP_HOST'] . '/wordpress');
            define('WP_SITEURL', 'http://' . $_SERVER['HTTP_HOST'] . '/wordpress');
        volumeMounts:
        - name: wordpress-storage
          mountPath: /var/www/html
      volumes:
      - name: wordpress-storage
        persistentVolumeClaim:
          claimName: wordpress-efs-pvc

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: wordpress-efs-pv
  namespace: wordpress-ns
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0705bf85a9f1b2c73::fsap-016b782223d093ced

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-efs-pvc
  namespace: wordpress-ns
  labels:
    app: wordpress
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 5Gi

---


kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: efs-sc
  namespace: wordpress-ns
provisioner: efs.csi.aws.com
---

apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc
  namespace: wordpress-ns
spec:
  type: ClusterIP
  selector:
    app: wordpress
    tier: frontend
  ports:
    - port: 80         
      targetPort: 80   
    

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /wordpress(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: wordpress-external-svc
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mongo-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /mongo
        pathType: Prefix
        backend:
          service:
            name: mongoex-external-svc
            port:
              number: 8081
---
# external services for ingress
apiVersion: v1
kind: Service
metadata:
  name: wordpress-external-svc
  namespace: default
spec:
  type: ExternalName
  externalName: wordpress-svc.wordpress-ns.svc.cluster.local
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: mongoex-external-svc
  namespace: default
spec:
  type: ExternalName
  externalName: mongoex-svc.mongo-ns.svc.cluster.local
  ports:
    - port: 8081
      targetPort: 8081

---



