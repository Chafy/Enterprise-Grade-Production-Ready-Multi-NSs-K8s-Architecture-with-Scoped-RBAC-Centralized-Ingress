apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongoex-app
  namespace: mongo-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongoex-app
  template:
    metadata:
      labels:
        app: mongoex-app
    spec:
      affinity:
       nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: 
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: In
                values:
                - mongo
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "mongo"
        effect: "NoSchedule"
      containers:
      - name: mongo-express
        image: mongo-express
        ports:
          - containerPort: 8081
        env:
          - name: ME_CONFIG_MONGODB_ADMINUSERNAME
            valueFrom:
              secretKeyRef:
                name: mongo-pass
                key: username
          - name: ME_CONFIG_MONGODB_ADMINPASSWORD
            valueFrom:
              secretKeyRef:
                name: mongo-pass
                key: password
          - name: ME_CONFIG_MONGODB_SERVER
            valueFrom:
              configMapKeyRef:
                name: mongoex-cm
                key: database_url